 <div class="col-md-4">

    <main class="container my-5">

        <h1 class="text-center text-success mb-4">Contact Us</h1>
        <p class="text-center">Get in touch with Discover Lesotho or plan your next visit.</p>

        <!-- Contact Form -->
        <section class="card shadow p-4 mb-5">
            <h2 class="mb-3">Contact Form</h2>

            <form id="contactForm">
                <div class="mb-3">
                    <label for="contactName" class="form-label">Full Name</label>
                    <input type="text" class="form-control" id="contactName" required>
                </div>

                <div class="mb-3">
                    <label for="contactEmail" class="form-label">Email Address</label>
                    <input type="email" class="form-control" id="contactEmail" required>
                </div>

                <div class="mb-3">
                    <label for="subject" class="form-label">Subject</label>
                    <input type="text" class="form-control" id="subject" required>
                </div>

                <div class="mb-3">
                    <label for="message" class="form-label">Your Message</label>
                    <textarea class="form-control" id="message" rows="4" required></textarea>
                </div>

                <button type="submit" class="btn btn-success">Send Message</button>

                <p id="contactMessage" class="mt-3" aria-live="polite"></p>
            </form>
        </section>

        <section class="card shadow p-4 mb-5">
            <h2 class="mb-3">Tourism Booking Form</h2>

            <form id="bookingForm">
                <div class="mb-3">
                    <label for="visitorName" class="form-label">Full Name</label>
                    <input type="text" class="form-control" id="visitorName" required>
                </div>

                <div class="mb-3">
                    <label for="visitorEmail" class="form-label">Email Address</label>
                    <input type="email" class="form-control" id="visitorEmail" required>
                </div>

                <div class="mb-3">
                    <label for="phone" class="form-label">Phone Number</label>
                    <input type="tel" class="form-control" id="phone" required>
                </div>

                <div class="mb-3">
                    <label for="visitDate" class="form-label">Visit Date</label>
                    <input type="date" class="form-control" id="visitDate" required>
                </div>

                <div class="mb-3">
                    <label for="destination" class="form-label">Choose Destination</label>
                    <select class="form-select" id="destination" required>
                        <option value="">Select a destination</option>
                        <option value="Maletsunyane Falls">Maletsunyane Falls</option>
                        <option value="Katse Dam">Katse Dam</option>
                        <option value="Thaba Bosiu">Thaba Bosiu</option>
                        <option value="Afriski Mountain Resort">Afriski Mountain Resort</option>
                        <option value="Sehlabathebe National Park">Sehlabathebe National Park</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label for="visitors" class="form-label">Number of Visitors</label>
                    <input type="number" class="form-control" id="visitors" min="1" max="50" required>
                </div>

                <button type="submit" class="btn btn-success">Submit Booking</button>

                <p id="bookingMessage" class="mt-3" aria-live="polite"></p>
            </form>
        </section>

    </main>
